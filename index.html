<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>llms.txt Browser</title>
    <meta name="description" content="Preview any llms.txt file. Paste a URL to view the raw source alongside its rendered Markdown in a split-pane viewer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="$THE_URL$" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="llms.txt Browser" />
    <meta property="og:description" content="Preview any llms.txt file. Paste a URL to view the raw source alongside its rendered Markdown." />
    <meta property="og:url" content="$THE_URL$" />
    <meta property="og:image" content="$THE_URL$/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="llms.txt Browser" />
    <meta name="twitter:description" content="Preview any llms.txt file. Paste a URL to view the raw source alongside its rendered Markdown." />
    <meta name="twitter:image" content="$THE_URL$/og-image.png" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
